name: Build Grit

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura (scarica JUCE)
        run: cmake -B build

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Salva il VST3
        uses: actions/upload-artifact@v4
        with:
          name: Grit-VST3-Windows
          path: build/Grit_artefacts/Release/VST3

      - name: Salva la versione Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Grit-Standalone-Windows
          path: build/Grit_artefacts/Release/Standalone/Grit.exe
